<!DOCTYPE html>
<html lang="es">
<head>

<title>Gastos Familia Poveda Mariño</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7ea;--card:#ffffff;--ink:#2a2140;--muted:#7a7090;--line:#f1e6d6;
  --q1:#12a594;--q2:#ff6b6b;--mes:#7c5cff;--aj:#ff9f1c;
  --ok:#16a34a;--warn:#e5484d;--radius:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background-color:var(--bg);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='170' height='170' viewBox='0 0 170 170'><g opacity='.26'><circle cx='26' cy='28' r='13' fill='%23ffc93c'/><circle cx='26' cy='28' r='9' fill='none' stroke='%23e0a000' stroke-width='2'/><text x='26' y='33' font-size='13' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%23b07800'>$</text><ellipse cx='108' cy='36' rx='19' ry='14' fill='%23ff8fab'/><circle cx='125' cy='34' r='6.5' fill='%23ff8fab'/><circle cx='127' cy='34' r='1.3' fill='%23c2546f'/><rect x='96' y='46' width='5' height='8' rx='2' fill='%23ff8fab'/><rect x='113' y='46' width='5' height='8' rx='2' fill='%23ff8fab'/><path d='M100 24 l5 -7 l4 7z' fill='%23ff8fab'/><circle cx='114' cy='32' r='1.7' fill='%23333'/><rect x='103' y='24' width='10' height='2.6' rx='1.3' fill='%23c2546f'/><g transform='rotate(-14 42 110)'><rect x='20' y='98' width='44' height='24' rx='4' fill='%2373d2a0'/><circle cx='42' cy='110' r='6.5' fill='none' stroke='%232e9e66' stroke-width='2'/><circle cx='27' cy='104' r='2' fill='%232e9e66'/><circle cx='57' cy='116' r='2' fill='%232e9e66'/></g><path d='M128 100 l4.5 9.5 10.5 1.2 -8 7 2.4 10.3 -9.4 -5.4 -9.4 5.4 2.4 -10.3 -8 -7 10.5 -1.2z' fill='%237c5cff'/><path d='M80 74 c-3-5-12-3-10 3.5 c1.2 3.6 10 9 10 9 s8.8-5.4 10-9 c2-6.5-7-8.5-10-3.5z' fill='%23ff6b6b'/><circle cx='86' cy='146' r='10' fill='%23ffc93c'/><circle cx='86' cy='146' r='6.5' fill='none' stroke='%23e0a000' stroke-width='1.8'/><path d='M152 66 l2.2 6.3 6.3 2.2 -6.3 2.2 -2.2 6.3 -2.2 -6.3 -6.3 -2.2 6.3 -2.2z' fill='%2312a594'/><path d='M18 66 l1.6 4.4 4.4 1.6 -4.4 1.6 -1.6 4.4 -1.6 -4.4 -4.4 -1.6 4.4 -1.6z' fill='%23ff9f1c'/><path d='M150 146 l1.6 4.4 4.4 1.6 -4.4 1.6 -1.6 4.4 -1.6 -4.4 -4.4 -1.6 4.4 -1.6z' fill='%23ff6b6b'/></g></svg>");background-attachment:fixed;min-height:100vh;color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:96px}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header{padding:22px 0 10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:Fredoka,"Plus Jakarta Sans",sans-serif;font-size:22px;font-weight:700;letter-spacing:0;color:#fff}
header{padding:16px 0 6px}
.banner{background:linear-gradient(120deg,#7c5cff 0%,#ff6b9d 55%,#ffb347 100%);border-radius:24px;padding:18px 18px 14px;box-shadow:0 10px 24px rgba(124,92,255,.25);position:relative;overflow:hidden}
.banner:after{content:"🐷💰✨";position:absolute;right:14px;bottom:-6px;pointer-events:none;font-size:40px;opacity:.28;letter-spacing:-6px}
.banner .sync{color:rgba(255,255,255,.9)}
h1 small{display:block;font-family:"Plus Jakarta Sans",sans-serif;font-size:12px;font-weight:600;color:rgba(255,255,255,.85);margin-top:3px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#bbb}
.dot.on{background:var(--ok)}.dot.busy{background:#e0a020}
.monthbar{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 6px}
.monthbar button{width:40px;height:40px;border-radius:50%;border:0;background:#fff;cursor:pointer;font-size:20px;font-weight:700;color:var(--accent);box-shadow:0 3px 10px rgba(42,33,64,.12)}
.monthbar .mname{font-family:Fredoka,sans-serif;font-weight:600;font-size:19px;background:#fff;padding:7px 16px;border-radius:30px;box-shadow:0 3px 10px rgba(42,33,64,.1);min-width:170px;text-align:center;text-transform:capitalize}
nav.tabs{position:sticky;top:0;z-index:5;padding:8px 0 10px}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:18px;padding:5px;box-shadow:0 4px 14px rgba(42,33,64,.1)}
.tabbar button{border:0;background:transparent;padding:10px 4px;border-radius:14px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.tabbar .ic{font-size:17px}
.tabbar button.act{color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.tabbar button.act[data-v=q1]{background:var(--q1)}.tabbar button.act[data-v=q2]{background:var(--q2)}.tabbar button.act[data-v=mes]{background:var(--mes)}.tabbar button.act[data-v=ajustes]{background:var(--aj)}
@media(max-width:720px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;top:auto;padding:8px 10px calc(10px + env(safe-area-inset-bottom));z-index:15}
  .tabbar{border-radius:22px;box-shadow:0 -2px 20px rgba(42,33,64,.15);background:rgba(255,255,255,.96)}
  .tabbar button{flex-direction:column;gap:2px;font-size:11px;padding:8px 2px}
  .tabbar .ic{font-size:21px}
  body{padding-bottom:170px}
  .fab{bottom:calc(92px + env(safe-area-inset-bottom))!important}
  .toast{bottom:160px!important}
}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:6px 0 14px}
@media(min-width:720px){.cards{grid-template-columns:repeat(4,1fr)}}
.card{background:rgba(255,255,255,.95);border-radius:var(--radius);padding:14px;border:0;box-shadow:0 4px 14px rgba(42,33,64,.07)}
.card .lbl{font-size:12px;color:var(--muted);font-weight:600}
.card .val{font-size:20px;font-weight:800;margin-top:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.card .sub{font-size:12px;color:var(--muted);margin-top:2px}
.card.hero{color:#fff;border:0;background-image:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,0))!important;box-shadow:0 8px 20px rgba(42,33,64,.18)}
.card.hero .lbl,.card.hero .sub{color:rgba(255,255,255,.8)}
.bar{height:6px;background:rgba(0,0,0,.08);border-radius:6px;margin-top:8px;overflow:hidden}
.hero .bar{background:rgba(255,255,255,.25)}
.bar i{display:block;height:100%;background:currentColor;border-radius:6px}
.hero .bar i{background:#fff}
.aporte{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.aporte .card{display:flex;align-items:center;gap:12px}
.aporte .val{white-space:nowrap}
.banner .sync{position:relative;z-index:1}
@media(max-width:720px){.aporte .card{gap:9px;padding:12px}.aporte .av{width:32px;height:32px;font-size:14px}.aporte .val{font-size:15px!important}.fab{width:58px;height:58px;padding:0!important;border-radius:50%!important;font-size:30px!important;line-height:1}.fab .ft{display:none}}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.group{background:rgba(255,255,255,.96);border:0;box-shadow:0 4px 14px rgba(42,33,64,.07);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.ghead{display:flex;justify-content:space-between;padding:12px 14px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:2px dashed var(--line);background:#fffaf2;color:var(--accent)}
.row{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid #f0ede6}
.row:last-child{border-bottom:0}
.row.paid .nm{text-decoration:line-through;color:var(--muted)}
.chk{width:28px;height:28px;border-radius:50%;border:2.5px solid #d9cfe8;background:#fff;cursor:pointer;display:grid;place-items:center;color:#fff;font-weight:900;font-size:15px}
.paid .chk{border-color:var(--accent);background:var(--accent)}
.nmwrap{min-width:0;cursor:pointer}
.nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nmsub{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.half{display:inline-block;font-size:10px;font-weight:800;padding:1px 7px;border-radius:20px;background:#fff1c7;color:#a06a00;margin-left:6px;vertical-align:2px}
.real{width:118px;text-align:right;padding:8px 10px;border:2px solid var(--line);border-radius:12px;background:#fffaf2;font-size:16px;font-variant-numeric:tabular-nums;font-weight:600}
.real:focus{outline:2px solid var(--accent);background:#fff}
.diff{font-size:11px;text-align:right;margin-top:3px;font-weight:600}
.pos{color:var(--ok)}.neg{color:var(--warn)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--warn)}
.fab{font-family:Fredoka,sans-serif;font-size:16px;position:fixed;right:18px;bottom:22px;z-index:8;border-radius:30px;padding:14px 20px;box-shadow:0 6px 18px rgba(0,0,0,.18);background:var(--accent)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;font-size:14px;border-bottom:1px solid #f0ede6}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.03em;background:#fffaf2}
tfoot td{font-weight:800;background:#f4efff}
.tscroll{overflow-x:auto}
.catrow{padding:10px 14px;border-bottom:1px solid #f0ede6}
.catrow:last-child{border-bottom:0}
.catrow .t{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.catrow .bar{height:8px}
.alert{background:#fff0f0;border:2px dashed #ffb4b4;color:#9b2c2c;border-radius:14px;padding:12px 14px;font-size:13px;margin-bottom:14px;line-height:1.45}
.alert.okk{background:#e9fbf3;border-color:#9fe3c4;color:#11694a}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field input,.field select{width:100%;padding:11px 12px;border:2px solid var(--line);border-radius:14px;background:#fffaf2;font-size:16px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;margin:6px 0 14px}
.check input{width:18px;height:18px}
.modal{position:fixed;inset:0;background:rgba(20,22,30,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:460px;border-radius:20px 20px 0 0;padding:20px 18px 26px;max-height:92vh;overflow:auto}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet h3{font-family:Fredoka,sans-serif;font-size:21px;font-weight:600;margin-bottom:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.actions .btn{flex:1}
.sec{font-family:Fredoka,sans-serif;font-size:17px;font-weight:600;color:var(--ink);margin:20px 2px 10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
.mini{font-size:12px;color:var(--muted);line-height:1.5}
@media(max-width:380px){.real{width:100px}.card .val{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="banner"><div class="top">
      <h1>💰 Gastos Familia Poveda Mariño<small>Presupuesto mensual por quincenas</small></h1>
      <div class="sync"><span class="dot" id="dot"></span><span id="synctxt">Cargando…</span></div>
    </div></div>
    <div class="monthbar">
      <button id="prev" aria-label="Mes anterior">‹</button>
      <div class="mname" id="mname"></div>
      <button id="next" aria-label="Mes siguiente">›</button>
    </div>
  </header>
  <nav class="tabs"><div class="tabbar" id="tabbar">
    <button data-v="q1"><span class="ic">🌤️</span><span>1ª Quincena</span></button>
    <button data-v="q2"><span class="ic">🌙</span><span>2ª Quincena</span></button>
    <button data-v="mes"><span class="ic">📊</span><span>Mes</span></button>
    <button data-v="ajustes"><span class="ic">⚙️</span><span>Ajustes</span></button>
  </div></nav>
  <main id="main"></main>
</div>
<button class="btn fab" id="fab" aria-label="Agregar gasto"><span class="fp">+</span><span class="ft"> Agregar gasto</span></button>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Datos por defecto (del Excel) ---------- */
const CATS=["Hogar","Comida y salidas","Moto","Personales","Préstamos","Ahorro","Servicios y suscripciones","Imprevistos"];
const DEFAULT_CFG={
  ingresos:{camilo:2900000,ginna:2400000,jero:75000},
  plantilla:[
    {id:"arriendo",name:"Arriendo",monto:970000,q:"1",cat:"Hogar"},
    {id:"gas",name:"Gas",monto:20000,q:"1",cat:"Hogar"},
    {id:"luz",name:"Luz",monto:80000,q:"2",cat:"Hogar"},
    {id:"agua",name:"Agua",monto:100000,q:"2",cat:"Hogar"},
    {id:"mercado",name:"Mercado",monto:350000,q:"ambas",cat:"Comida y salidas"},
    {id:"verduras",name:"Verduras",monto:100000,q:"ambas",cat:"Comida y salidas"},
    {id:"findes",name:"Fines de semana",monto:400000,q:"ambas",cat:"Comida y salidas"},
    {id:"gasolina",name:"Gasolina",monto:160000,q:"ambas",cat:"Moto"},
    {id:"aceite",name:"Cambio de aceite",monto:120000,q:"1",cat:"Moto"},
    {id:"arreglos",name:"Arreglos",monto:70000,q:"1",cat:"Moto"},
    {id:"jero",name:"Jero",monto:340000,q:"1",cat:"Personales"},
    {id:"ginna",name:"Ginna",monto:100000,q:"1",cat:"Personales"},
    {id:"camilo",name:"Camilo",monto:100000,q:"1",cat:"Personales"},
    {id:"motoyei",name:"Moto Yei",monto:500000,q:"1",cat:"Préstamos"},
    {id:"motofernan",name:"Moto Fernan",monto:435000,q:"1",cat:"Préstamos"},
    {id:"ahorrocamilo",name:"Ahorro Camilo",monto:200000,q:"ambas",cat:"Ahorro"},
    {id:"ahorroginna",name:"Ahorro Ginna",monto:200000,q:"ambas",cat:"Ahorro"},
    {id:"planjero",name:"Plan premium Jero",monto:60000,q:"1",cat:"Servicios y suscripciones"},
    {id:"youtube",name:"YouTube Premium",monto:23000,q:"2",cat:"Servicios y suscripciones"},
    {id:"spotify",name:"Spotify",monto:10000,q:"2",cat:"Servicios y suscripciones"},
    {id:"internet",name:"Internet y celular Camilo",monto:124000,q:"2",cat:"Servicios y suscripciones"},
    {id:"celginna",name:"Celular Ginna",monto:65000,q:"2",cat:"Servicios y suscripciones"},
    {id:"emergencias",name:"Emergencias",monto:50000,q:"ambas",cat:"Imprevistos"},
    {id:"otros",name:"Otros",monto:50000,q:"ambas",cat:"Imprevistos"}
  ]
};
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const COLORS={q1:"#12a594",q2:"#ff6b6b",mes:"#7c5cff",ajustes:"#ff9f1c"};

/* ---------- Estado ---------- */
const clone=o=>JSON.parse(JSON.stringify(o));
const LS="gastos_poveda_v1";
let cfg=clone(DEFAULT_CFG), months={};
try{const s=JSON.parse(localStorage.getItem(LS)||"null");if(s){if(s.cfg)cfg=s.cfg;if(s.months)months=s.months;}}catch(e){}
const now=new Date();
let cur=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
let view=["q1","q2","mes","ajustes"].includes(location.hash.slice(1))?location.hash.slice(1):(now.getDate()<=15?"q1":"q2");

function persistLocal(){try{localStorage.setItem(LS,JSON.stringify({cfg,months}))}catch(e){}}
function getMonth(k){return months[k]||{items:clone(cfg.plantilla),reg:{}}}
function touchMonth(k){if(!months[k])months[k]=getMonth(k);return months[k]}

/* ---------- Utilidades ---------- */
const fmt=n=>"$ "+Math.round(n||0).toLocaleString("es-CO");
const parseNum=s=>{const n=Number(String(s).replace(/[^\d-]/g,""));return isFinite(n)?n:0};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const qVal=(it,q)=>it.q==="ambas"?it.monto/2:(it.q===q?it.monto:0);
const inQ=(it,q)=>it.q==="ambas"||it.q===q;
function monthLabel(k){const[y,m]=k.split("-");return MESES[+m-1]+" "+y}
function shift(k,d){let[y,m]=k.split("-").map(Number);m+=d;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+"-"+String(m).padStart(2,"0")}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),1800)}
function regOf(m,id){return m.reg[id]||(m.reg[id]={})}

function quinStats(m,q){
  let pres=0,pagado=0,realT=0,pend=0,n=0,np=0,dif=0;
  m.items.forEach(it=>{if(!inQ(it,q))return;const p=qVal(it,q);const r=m.reg[it.id]||{};
    const paid=!!r["p"+q];const real=r["r"+q];n++;pres+=p;
    if(paid){np++;pagado+=(real??p)}else pend+=p;
    if(real!=null){realT+=real;dif+=p-real}});
  return{pres,pagado,realT,pend,n,np,dif};
}

/* ---------- Sincronización (nube) ---------- */
let DB=null,pending={},timers={},unsubMonth=null;
function setSync(state,txt){const d=document.getElementById("dot");d.className="dot"+(state==="on"?" on":state==="busy"?" busy":"");document.getElementById("synctxt").textContent=txt}
function schedule(path,getData){
  persistLocal();
  if(!DB)return;
  pending[path]=true;setSync("busy","Guardando…");
  clearTimeout(timers[path]);
  timers[path]=setTimeout(async()=>{
    try{await DB.doc(path).set(clone(getData()));setSync("on","Sincronizado")}
    catch(e){
      if(e&&e.code==="unavailable"){setTimeout(()=>schedule(path,getData),1500);return}
      setSync("off","Solo en este dispositivo")}
    finally{pending[path]=false}
  },700);
}
function saveCfg(){schedule("familia/config",()=>cfg)}
function saveMonth(k){touchMonth(k);schedule("meses/"+k,()=>months[k])}

function busyTyping(){const a=document.activeElement;return a&&(a.tagName==="INPUT"||a.tagName==="SELECT")}
let deferred=false;
function safeRender(){if(busyTyping()||document.getElementById("modal").classList.contains("open")){deferred=true;return}render()}
document.addEventListener("focusout",()=>setTimeout(()=>{if(deferred&&!busyTyping()&&!document.getElementById("modal").classList.contains("open")){deferred=false;render()}},50));

function subMonth(){
  if(!DB)return;
  if(unsubMonth)unsubMonth();
  const k=cur,path="meses/"+k;
  unsubMonth=DB.doc(path).onSnapshot(s=>{
    if(pending[path]||s.metadata.hasPendingWrites)return;
    if(s.exists){months[k]=clone(s.data());persistLocal();if(k===cur)safeRender()}
  },()=>{});
}
(async()=>{
  setSync("off","Solo en este dispositivo");
  if(!(window.claude&&claude.use))return;
  let db=null;try{db=await claude.use("db")}catch(e){}
  if(!db)return;
  DB=db;setSync("busy","Conectando…");
  const to=setTimeout(()=>setSync("off","Sin conexión — guardado local"),10000);
  DB.doc("familia/config").onSnapshot(s=>{
    if(!s.metadata.fromCache){clearTimeout(to);setSync("on","Sincronizado")}
    if(pending["familia/config"]||s.metadata.hasPendingWrites)return;
    if(s.exists){const d=s.data();if(d&&d.plantilla){cfg=clone(d);persistLocal();safeRender()}}
  },()=>{clearTimeout(to);setSync("off","Solo en este dispositivo")});
  subMonth();
})();

/* ---------- Render ---------- */
function render(){
  document.body.style.setProperty("--accent",COLORS[view]);document.querySelector('meta[name="theme-color"]').setAttribute("content",COLORS[view]);
  document.getElementById("mname").textContent=monthLabel(cur);
  document.querySelectorAll("#tabbar button").forEach(b=>b.classList.toggle("act",b.dataset.v===view));
  document.getElementById("fab").style.display=view==="mes"?"none":"";
  const main=document.getElementById("main");
  if(view==="q1"||view==="q2")main.innerHTML=renderQ(view.slice(1));
  else if(view==="mes")main.innerHTML=renderMes();
  else main.innerHTML=renderAjustes();
}

function renderQ(q){
  const m=getMonth(cur),st=quinStats(m,q),col=COLORS["q"+q];
  const pct=st.n?Math.round(st.np/st.n*100):0;
  const half=st.pres/2;
  const ingQ={camilo:cfg.ingresos.camilo/2,ginna:cfg.ingresos.ginna/2};
  let h=`<div class="cards">
    <div class="card hero" style="background-color:${col}"><div class="lbl">Presupuesto ${q}ª quincena</div><div class="val">${fmt(st.pres)}</div><div class="sub">${q==="1"?"Del 1 al 15":"Del 16 al fin de mes"}</div></div>
    <div class="card"><div class="lbl">Pagado</div><div class="val">${fmt(st.pagado)}</div><div class="sub">${st.np} de ${st.n} gastos</div><div class="bar" style="color:${col}"><i style="width:${pct}%"></i></div></div>
    <div class="card"><div class="lbl">Pendiente por pagar</div><div class="val">${fmt(st.pend)}</div><div class="sub">${st.n-st.np} gastos</div></div>
    <div class="card"><div class="lbl">Diferencia (presup. − real)</div><div class="val ${st.dif<0?"neg":st.dif>0?"pos":""}">${st.dif>0?"+":""}${fmt(st.dif)}</div><div class="sub">${st.dif<0?"Se gastó de más":st.dif>0?"Ahorro frente al presupuesto":"Sin diferencias"}</div></div>
  </div>
  <div class="aporte">
    <div class="card"><div class="av" style="background:linear-gradient(135deg,#12a594,#4fd1c5)">C</div><div><div class="lbl">Aporte Camilo</div><div class="val" style="font-size:17px">${fmt(half)}</div><div class="sub">${Math.round(half/ingQ.camilo*100)||0}% de su quincena</div></div></div>
    <div class="card"><div class="av" style="background:linear-gradient(135deg,#ff6b9d,#ffb347)">G</div><div><div class="lbl">Aporte Ginna</div><div class="val" style="font-size:17px">${fmt(half)}</div><div class="sub">${Math.round(half/ingQ.ginna*100)||0}% de su quincena</div></div></div>
  </div>`;
  const groups={};
  m.items.filter(it=>inQ(it,q)).forEach(it=>{(groups[it.cat]=groups[it.cat]||[]).push(it)});
  const order=[...CATS,...Object.keys(groups).filter(c=>!CATS.includes(c))];
  order.forEach(cat=>{const list=groups[cat];if(!list)return;
    const tot=list.reduce((a,it)=>a+qVal(it,q),0);
    h+=`<div class="group"><div class="ghead"><span>${esc(cat)}</span><span>${fmt(tot)}</span></div>`;
    list.forEach(it=>{const r=m.reg[it.id]||{},p=qVal(it,q),paid=!!r["p"+q],real=r["r"+q];
      const d=real!=null?p-real:null;
      h+=`<div class="row ${paid?"paid":""}">
        <button class="chk" data-act="pay" data-id="${it.id}" data-q="${q}" aria-label="Marcar pagado">${paid?"✓":""}</button>
        <div class="nmwrap" data-act="edit" data-id="${it.id}"><div class="nm">${esc(it.name)}${it.q==="ambas"?'<span class="half">½</span>':""}</div>
          <div class="nmsub">Presup. ${fmt(p)}${it.q==="ambas"?" · mes "+fmt(it.monto):""}</div></div>
        <div><input class="real" inputmode="numeric" placeholder="${Math.round(p).toLocaleString("es-CO")}" value="${real!=null?Math.round(real).toLocaleString("es-CO"):""}" data-act="real" data-id="${it.id}" data-q="${q}" aria-label="Valor real">
          ${d!=null&&d!==0?`<div class="diff ${d<0?"neg":"pos"}">${d>0?"+":""}${fmt(d)}</div>`:""}</div>
      </div>`});
    h+=`</div>`});
  h+=`<p class="mini" style="margin:6px 4px 20px">Toca ✓ para marcar pagado (si no escribes el valor real, se toma el presupuestado). Toca el nombre para editar o eliminar. <b>½</b> = gasto dividido entre las dos quincenas.</p>`;
  return h;
}

function renderMes(){
  const m=getMonth(cur),s1=quinStats(m,"1"),s2=quinStats(m,"2");
  const total=s1.pres+s2.pres,ing=cfg.ingresos,ingT=ing.camilo+ing.ginna+ing.jero,saldo=ingT-total;
  const pagado=s1.pagado+s2.pagado,nn=s1.n+s2.n,np=s1.np+s2.np;
  let h=`<div class="cards">
    <div class="card hero" style="background-color:var(--mes)"><div class="lbl">Gastos del mes</div><div class="val">${fmt(total)}</div><div class="sub">1ª ${fmt(s1.pres)} · 2ª ${fmt(s2.pres)}</div></div>
    <div class="card"><div class="lbl">Ingresos del mes</div><div class="val">${fmt(ingT)}</div><div class="sub">Camilo, Ginna y Jero</div></div>
    <div class="card"><div class="lbl">Saldo libre</div><div class="val ${saldo<0?"neg":"pos"}">${fmt(saldo)}</div><div class="sub">Ingresos − gastos</div></div>
    <div class="card"><div class="lbl">Pagado en el mes</div><div class="val">${fmt(pagado)}</div><div class="sub">${np} de ${nn} pagos</div><div class="bar" style="color:var(--mes)"><i style="width:${nn?np/nn*100:0}%"></i></div></div>
  </div>`;
  // Aportes
  const a1=s1.pres/2,a2=s2.pres/2,qc=ing.camilo/2,qg=ing.ginna/2;
  h+=`<div class="sec">Aporte de cada uno (mitad y mitad)</div>
  <div class="group tscroll"><table>
    <thead><tr><th></th><th>1ª quincena</th><th>2ª quincena</th><th>Mes</th></tr></thead>
    <tbody>
      <tr><td>Camilo</td><td>${fmt(a1)}</td><td>${fmt(a2)}</td><td>${fmt(a1+a2)}</td></tr>
      <tr><td>Ginna</td><td>${fmt(a1)}</td><td>${fmt(a2)}</td><td>${fmt(a1+a2)}</td></tr>
    </tbody>
    <tfoot><tr><td>Total</td><td>${fmt(s1.pres)}</td><td>${fmt(s2.pres)}</td><td>${fmt(total)}</td></tr></tfoot>
  </table></div>`;
  const over=[];if(a1>qg)over.push("Ginna");if(a1>qc)over.push("Camilo");
  if(over.length)h+=`<div class="alert">⚠️ En la 1ª quincena el aporte de <b>${over.join(" y ")}</b> (${fmt(a1)}) es mayor que media quincena de su ingreso. Conviene guardar parte de la 2ª quincena del mes anterior para cubrirlo. Si prefieren pagar lo mismo cada quincena, serían <b>${fmt(total/4)}</b> por persona por quincena.</div>`;
  else h+=`<div class="alert okk">✓ Los aportes de cada quincena caben dentro del ingreso quincenal de cada uno.</div>`;
  // Categorías
  const cats={};m.items.forEach(it=>{cats[it.cat]=(cats[it.cat]||0)+it.monto});
  const maxc=Math.max(1,...Object.values(cats));
  h+=`<div class="sec">Por categoría</div><div class="group">`;
  Object.entries(cats).sort((a,b)=>b[1]-a[1]).forEach(([c,v])=>{
    h+=`<div class="catrow"><div class="t"><span>${esc(c)}</span><span>${fmt(v)} <span class="mini">· ${Math.round(v/total*100)}%</span></span></div><div class="bar" style="color:var(--mes)"><i style="width:${v/maxc*100}%"></i></div></div>`});
  h+=`</div>`;
  // Detalle
  h+=`<div class="sec">Detalle del mes</div><div class="group tscroll"><table>
    <thead><tr><th>Gasto</th><th>1ª Q</th><th>2ª Q</th><th>Total</th><th>Real</th></tr></thead><tbody>`;
  let rT=0;
  m.items.forEach(it=>{const r=m.reg[it.id]||{};const v1=qVal(it,"1"),v2=qVal(it,"2");
    const real=(r.r1!=null?r.r1:(r.p1?v1:0))+(r.r2!=null?r.r2:(r.p2?v2:0));rT+=real;
    h+=`<tr><td>${esc(it.name)}</td><td>${v1?fmt(v1):"—"}</td><td>${v2?fmt(v2):"—"}</td><td><b>${fmt(it.monto)}</b></td><td>${real?fmt(real):"—"}</td></tr>`});
  h+=`</tbody><tfoot><tr><td>Total</td><td>${fmt(s1.pres)}</td><td>${fmt(s2.pres)}</td><td>${fmt(total)}</td><td>${fmt(rT)}</td></tr></tfoot></table></div>`;
  return h;
}

function renderAjustes(){
  const ing=cfg.ingresos;
  let h=`<div class="sec">Ingresos mensuales</div><div class="card">
    <div class="field"><label>Ingreso Camilo</label><input inputmode="numeric" data-act="ing" data-k="camilo" value="${Math.round(ing.camilo).toLocaleString("es-CO")}"></div>
    <div class="field"><label>Ingreso Ginna</label><input inputmode="numeric" data-act="ing" data-k="ginna" value="${Math.round(ing.ginna).toLocaleString("es-CO")}"></div>
    <div class="field" style="margin-bottom:0"><label>Ingresos adicionales (Jero)</label><input inputmode="numeric" data-act="ing" data-k="jero" value="${Math.round(ing.jero).toLocaleString("es-CO")}"></div>
  </div>
  <div class="sec">Gastos fijos (plantilla para meses nuevos)</div>
  <p class="mini" style="margin:-4px 2px 10px">Cada mes nuevo arranca con esta lista. Los cambios aquí no alteran los meses que ya tienen registros.</p>
  <div class="group">`;
  ["1","ambas","2"].forEach(q=>{
    const list=cfg.plantilla.filter(it=>it.q===q);if(!list.length)return;
    h+=`<div class="ghead"><span>${q==="1"?"Solo 1ª quincena":q==="2"?"Solo 2ª quincena":"Ambas quincenas (se divide ½)"}</span><span>${fmt(list.reduce((a,b)=>a+b.monto,0))}</span></div>`;
    list.forEach(it=>{h+=`<div class="row" style="grid-template-columns:1fr auto"><div class="nmwrap" data-act="editT" data-id="${it.id}"><div class="nm">${esc(it.name)}</div><div class="nmsub">${esc(it.cat)}</div></div><div style="font-weight:700;font-variant-numeric:tabular-nums">${fmt(it.monto)}</div></div>`})});
  h+=`</div>
  <div class="sec">Este mes (${monthLabel(cur)})</div>
  <div class="card"><p class="mini" style="margin-bottom:10px">Si cambiaste la plantilla y quieres que este mes la use, puedes recargarla. Se conservan los pagos y valores reales de los gastos que sigan existiendo.</p>
  <button class="btn ghost" data-act="resetMonth" style="width:100%">Recargar este mes desde la plantilla</button></div>`;
  return h;
}

/* ---------- Modal ---------- */
function openModal(html){document.getElementById("sheet").innerHTML=html;document.getElementById("modal").classList.add("open")}
function closeModal(){document.getElementById("modal").classList.remove("open");if(deferred){deferred=false}render()}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});

function editForm(it,mode){
  // mode: "month" | "template" | "newMonth" | "newTemplate"
  const isNew=mode.startsWith("new"),isT=mode==="template"||mode==="newTemplate";
  const opts=CATS.map(c=>`<option ${c===it.cat?"selected":""}>${c}</option>`).join("");
  openModal(`<h3>${isNew?"Agregar gasto":"Editar gasto"}${isT?" (plantilla)":""}</h3>
    <div class="field"><label>Nombre</label><input id="f_name" value="${esc(it.name||"")}" placeholder="Ej: Netflix"></div>
    <div class="field"><label>Valor mensual</label><input id="f_monto" inputmode="numeric" value="${it.monto?Math.round(it.monto).toLocaleString("es-CO"):""}" placeholder="0"></div>
    <div class="field"><label>¿En qué quincena se paga?</label><select id="f_q">
      <option value="1" ${it.q==="1"?"selected":""}>1ª quincena</option>
      <option value="2" ${it.q==="2"?"selected":""}>2ª quincena</option>
      <option value="ambas" ${it.q==="ambas"?"selected":""}>Ambas (se divide en dos)</option></select></div>
    <div class="field"><label>Categoría</label><select id="f_cat">${opts}</select></div>
    ${isT?"":`<label class="check"><input type="checkbox" id="f_tpl" checked> Aplicar también a los meses siguientes</label>`}
    <div class="actions"><button class="btn" id="f_save" style="background:var(--accent)">Guardar</button><button class="btn ghost" id="f_cancel">Cancelar</button></div>
    ${isNew?"":`<div class="actions" style="margin-top:10px"><button class="btn ghost" id="f_del" style="color:var(--warn);border-color:#f2cdbd">Eliminar gasto</button></div>`}`);
  const fm=document.getElementById("f_monto");
  fm.addEventListener("input",()=>{const n=parseNum(fm.value);fm.value=n?n.toLocaleString("es-CO"):""});
  document.getElementById("f_cancel").onclick=closeModal;
  document.getElementById("f_save").onclick=()=>{
    const name=document.getElementById("f_name").value.trim();
    if(!name){document.getElementById("f_name").focus();return}
    const data={id:it.id||("g"+Date.now().toString(36)),name,monto:parseNum(fm.value),q:document.getElementById("f_q").value,cat:document.getElementById("f_cat").value};
    const alsoT=isT||document.getElementById("f_tpl").checked;
    if(!isT){const m=touchMonth(cur);upsert(m.items,data);saveMonth(cur)}
    if(alsoT){upsert(cfg.plantilla,data);saveCfg()}
    closeModal();toast(isNew?"Gasto agregado":"Cambios guardados");
  };
  const del=document.getElementById("f_del");
  if(del)del.onclick=()=>{
    if(!del.dataset.sure){del.dataset.sure=1;del.textContent="¿Seguro? Toca otra vez para eliminar";del.style.background="var(--warn)";del.style.color="#fff";return}
    const alsoT=isT||document.getElementById("f_tpl").checked;
    if(!isT){const m=touchMonth(cur);m.items=m.items.filter(x=>x.id!==it.id);delete m.reg[it.id];saveMonth(cur)}
    if(alsoT){cfg.plantilla=cfg.plantilla.filter(x=>x.id!==it.id);saveCfg()}
    closeModal();toast("Gasto eliminado");
  };
}
function upsert(arr,d){const i=arr.findIndex(x=>x.id===d.id);if(i>=0)arr[i]=d;else arr.push(d)}

/* ---------- Eventos ---------- */
document.getElementById("tabbar").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;view=b.dataset.v;history.replaceState(null,"","#"+view);render();window.scrollTo({top:0})});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(["q1","q2","mes","ajustes"].includes(h)){view=h;render()}});
document.getElementById("prev").onclick=()=>{cur=shift(cur,-1);subMonth();render()};
document.getElementById("next").onclick=()=>{cur=shift(cur,1);subMonth();render()};
document.getElementById("fab").onclick=()=>{
  const q=view==="q2"?"2":"1";
  editForm({name:"",monto:0,q,cat:CATS[0]},view==="ajustes"?"newTemplate":"newMonth");
};
document.getElementById("main").addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  const act=t.dataset.act;
  if(act==="pay"){const m=touchMonth(cur),r=regOf(m,t.dataset.id),q=t.dataset.q;r["p"+q]=!r["p"+q];saveMonth(cur);render()}
  else if(act==="edit"){const it=getMonth(cur).items.find(x=>x.id===t.dataset.id);if(it)editForm(clone(it),"month")}
  else if(act==="editT"){const it=cfg.plantilla.find(x=>x.id===t.dataset.id);if(it)editForm(clone(it),"template")}
  else if(act==="resetMonth"){
    if(!t.dataset.sure){t.dataset.sure=1;t.textContent="Toca otra vez para confirmar";t.style.borderColor="var(--warn)";t.style.color="var(--warn)";return}
    const m=touchMonth(cur);m.items=clone(cfg.plantilla);Object.keys(m.reg).forEach(id=>{if(!m.items.some(x=>x.id===id))delete m.reg[id]});
    saveMonth(cur);toast("Mes actualizado");render();
  }
});
document.getElementById("main").addEventListener("input",e=>{
  const t=e.target;if(t.dataset.act==="real"||t.dataset.act==="ing"){const n=parseNum(t.value);const pos=t.value.length-t.selectionStart;t.value=t.value.trim()===""?"":n.toLocaleString("es-CO");try{const p=Math.max(0,t.value.length-pos);t.setSelectionRange(p,p)}catch(_){}}
});
document.getElementById("main").addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.act==="real"){const m=touchMonth(cur),r=regOf(m,t.dataset.id),q=t.dataset.q;
    if(t.value.trim()===""){delete r["r"+q]}else{r["r"+q]=parseNum(t.value);r["p"+q]=true}
    saveMonth(cur);render()}
  if(t.dataset.act==="ing"){cfg.ingresos[t.dataset.k]=parseNum(t.value);saveCfg();toast("Ingreso actualizado")}
});
document.getElementById("main").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT")e.target.blur()});

render();
</script>
</body>
</html>
